name: BTC DCA Telegram Push

on:
  schedule:
    # GitHub-Cron laeuft in UTC. Der echte Binance-Kauf ist 08:39:54 DE-Zeit,
    # darum feuern wir NACH dem Kauf (~08:45 DE) und ganzjaehrig korrekt:
    #   06:45 UTC  -> im Sommer = 08:45 DE  (sendet)
    #   07:45 UTC  -> im Winter = 08:45 DE  (sendet)
    # bot.py prueft die lokale Uhrzeit und sendet nur beim 08:40-08:59-Lauf.
    - cron: "45 6 * * 1"
    - cron: "45 7 * * 1"
  # Manuell ausloesbar zum Testen (sendet sofort, ohne Zeitpruefung).
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort senden (Zeitpruefung umgehen)"
        type: boolean
        default: true

# Verhindert parallele Laeufe, falls beide Crons mal kollidieren.
concurrency:
  group: btc-dca-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push senden
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python bot.py
