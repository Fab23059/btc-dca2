: BTC DCA Telegram Push

on:
  schedule:
    # GitHub-Cron ist "best effort" und kann sich verspaeten ODER ganz ausfallen.
    # Der Bitvavo-Kauf ist montags 20:50 DE-Zeit -> wir feuern danach, mehrfach.
    # bot.py sendet nur den ERSTEN Lauf nach 20:50 und merkt sich das in
    # state/last_sent.txt -> genau EINE Nachricht, selbst wenn Laeufe ausfallen.
    - cron: "50 18 * * 1"   # Sommer 20:50 / Winter 19:50
    - cron: "20 19 * * 1"   # Sommer 21:20 / Winter 20:20
    - cron: "50 19 * * 1"   # Sommer 21:50 / Winter 20:50
    - cron: "20 20 * * 1"   # Sommer 22:20 / Winter 21:20
  # Manuell ausloesbar zum Testen (sendet sofort, ohne Zeit-/Dedup-Pruefung).
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort senden (Zeit & Dedup umgehen)"
        type: boolean
        default: true

# Schreibrecht, damit der Bot den Sende-Status (state/last_sent.txt) sichern kann.
permissions:
  contents: write

# Verhindert parallele Laeufe, falls mehrere Crons mal kollidieren.
concurrency:
  group: btc-dca-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push senden
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python bot.py

      - name: Sende-Status sichern
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -n "$(git status --porcelain state/last_sent.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_sent.txt
            git commit -m "DCA: Nachricht gesendet [skip ci]"
            git push || echo "Push fehlgeschlagen (nicht kritisch fuer diese Woche)"
          else
            echo "Kein neuer Sende-Status zu sichern."
          fi
